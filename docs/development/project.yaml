contract: docdd.workspace/1
project:
  id: docdd-console
  name: DocDD Console
  description: Инструмент контроля разработки по правилу «документ ведёт код»
paths:
  requirements: requirements
  design: design
  decisions: decisions
  contracts: contracts
  tasks: tasks
  phases: phases
  tests: tests
  diagrams: diagrams
  maps: maps
  reference: reference
sources:
  shared:
    - path: builtin
      tags: [general, design]
  # Код, на который ссылаются документы и свидетельства карт.
  code: [server, cli, app]
  # Проектные документы этого репозитория лежат в docs/ и записями пока не стали.
  docs: []
  # Клиентская часть: по ней строится карта пользовательских путей.
  client: [app]
  # Черновики новых редакций A-0001..A-0009 в skill-стиле (supersedes).
  inbox: [docs/inbox]
# Дизайн консоли: стек Nuxt UI, файлы темы (docs/16-design-system.md). Пока консоль
# не приняла токены, сверка называет расхождение — это очередь задач, а не поломка.
design:
  stacks:
    - id: nuxt-ui
      files:
        css: app/assets/css/main.css
        config: app/design-tokens.ts

roles:
  # Роли курса M-0008 (adr/0020): кто ведёт какую часть работы.
  - id: architect
    name: Архитектор
  - id: developer
    name: Разработчик
  - id: pm
    name: Менеджер проекта
  - id: analyst
    name: Аналитик
  - id: domain
    name: Доменный специалист
  - id: viewer
    name: Наблюдатель
policy:
  require_approved_docs_before_dev: true
  require_verification_before_done: true
  stale_in_progress_days: 14
